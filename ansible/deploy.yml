
---
- name: Deploy Java CI/CD Application to Azure AKS
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check Kubernetes manifest files
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../k8s/deployment.yaml"
      register: deployment_file

    - name: Verify deployment manifest exists
      ansible.builtin.assert:
        that:
          - deployment_file.stat.exists

    - name: Apply Kubernetes Deployment
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "{{ playbook_dir }}/../k8s/deployment.yaml"

    - name: Apply Kubernetes Service
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "{{ playbook_dir }}/../k8s/service.yaml"

    - name: Update deployment with the new Git commit image
      ansible.builtin.command:
        argv:
          - kubectl
          - set
          - image
          - deployment/java-cicd-deployment
          - java-cicd-container=jvocicdregistry.azurecr.io/java-cicd-app:{{ lookup('env', 'GITHUB_SHA') }}

    - name: Wait for deployment rollout
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - deployment/java-cicd-deployment
          - --timeout=180s

    - name: Verify Kubernetes pods
      ansible.builtin.command: kubectl get pods

    - name: Verify Kubernetes services
      ansible.builtin.command: kubectl get services
